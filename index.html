<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Velour</title>
<style>
  :root {
    --bg: #0e0b14;
    --panel: #171225;
    --panel-2: #1f1833;
    --accent: #b892ff;
    --accent-2: #ff8fc7;
    --text: #ece7f7;
    --muted: #9a8fb8;
    --user: #3a2d5c;
    --bot: #241a3d;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; margin: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: radial-gradient(circle at 20% 0%, #1a1330 0%, var(--bg) 55%);
    color: var(--text);
    display: flex;
    flex-direction: column;
    height: 100dvh;
    overflow: hidden;
  }

  /* ---------- Header ---------- */
  header {
    padding: 14px 18px;
    display: flex;
    align-items: center;
    gap: 12px;
    border-bottom: 1px solid rgba(184,146,255,.15);
    background: rgba(14,11,20,.7);
    backdrop-filter: blur(10px);
    flex-shrink: 0;
  }
  header .avatar {
    width: 42px; height: 42px; border-radius: 50%;
    background: linear-gradient(135deg, var(--accent), var(--accent-2));
    display: grid; place-items: center;
    font-weight: 700; font-size: 18px; color: #1a1330;
    flex-shrink: 0;
  }
  header .meta { flex: 1; min-width: 0; }
  header .name { font-weight: 600; font-size: 16px; }
  header .tag { font-size: 12px; color: var(--muted); margin-top: 1px;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  header button {
    background: var(--panel-2); color: var(--text);
    border: 1px solid rgba(184,146,255,.25);
    border-radius: 10px; padding: 8px 12px; font-size: 13px;
    cursor: pointer; flex-shrink: 0;
  }
  header button:active { transform: scale(.96); }

  /* ---------- Character picker ---------- */
  #picker {
    flex: 1; overflow-y: auto; padding: 18px;
    display: grid; gap: 12px;
    grid-template-columns: 1fr;
  }
  #picker h1 {
    font-size: 22px; margin: 6px 4px 10px;
    background: linear-gradient(90deg, var(--accent), var(--accent-2));
    -webkit-background-clip: text; background-clip: text;
    -webkit-text-fill-color: transparent;
  }
  .card {
    background: var(--panel);
    border: 1px solid rgba(184,146,255,.15);
    border-radius: 16px;
    padding: 16px;
    display: flex; gap: 14px; align-items: center;
    cursor: pointer;
    transition: transform .12s ease, border-color .12s ease;
  }
  .card:active { transform: scale(.98); border-color: var(--accent); }
  .card .avatar {
    width: 54px; height: 54px; border-radius: 50%;
    background: linear-gradient(135deg, var(--accent), var(--accent-2));
    display: grid; place-items: center;
    font-weight: 700; font-size: 22px; color: #1a1330;
    flex-shrink: 0;
  }
  .card .info { min-width: 0; }
  .card .info .name { font-weight: 600; font-size: 16px; }
  .card .info .tag { font-size: 13px; color: var(--accent); margin: 2px 0 4px; }
  .card .info .bio { font-size: 12.5px; color: var(--muted); line-height: 1.4; }

  /* ---------- Chat ---------- */
  #chat {
    flex: 1; overflow-y: auto; padding: 18px 16px 8px;
    display: none; flex-direction: column; gap: 10px;
    scroll-behavior: smooth;
  }
  #chat.active { display: flex; }
  .msg {
    max-width: 82%;
    padding: 11px 15px;
    border-radius: 18px;
    font-size: 15px;
    line-height: 1.45;
    word-wrap: break-word;
    animation: pop .18s ease;
  }
  @keyframes pop { from { opacity: 0; transform: translateY(6px); } }
  .msg.user {
    align-self: flex-end;
    background: var(--user);
    border-bottom-right-radius: 6px;
  }
  .msg.bot {
    align-self: flex-start;
    background: var(--bot);
    border-bottom-left-radius: 6px;
  }
  .msg.typing { color: var(--muted); font-style: italic; }

  /* ---------- Composer ---------- */
  #composer {
    display: none;
    padding: 10px 12px calc(10px + env(safe-area-inset-bottom));
    gap: 8px;
    border-top: 1px solid rgba(184,146,255,.15);
    background: rgba(14,11,20,.85);
    backdrop-filter: blur(10px);
    flex-shrink: 0;
  }
  #composer.active { display: flex; }
  #composer input {
    flex: 1;
    background: var(--panel-2);
    border: 1px solid rgba(184,146,255,.2);
    border-radius: 22px;
    padding: 12px 16px;
    color: var(--text);
    font-size: 15px;
    outline: none;
  }
  #composer input:focus { border-color: var(--accent); }
  #composer button {
    width: 46px; height: 46px; border-radius: 50%;
    border: none; flex-shrink: 0;
    background: linear-gradient(135deg, var(--accent), var(--accent-2));
    color: #1a1330; font-size: 20px; font-weight: 700;
    cursor: pointer;
  }
  #composer button:disabled { opacity: .45; }
  #composer button:active:not(:disabled) { transform: scale(.94); }

  #error {
    display: none;
    margin: 0 16px 10px;
    padding: 10px 14px;
    background: rgba(255,80,110,.12);
    border: 1px solid rgba(255,80,110,.4);
    border-radius: 12px;
    color: #ff9eb0;
    font-size: 13px;
  }
</style>
</head>
<body>

<header id="header" style="display:none">
  <div class="avatar" id="hAvatar">?</div>
  <div class="meta">
    <div class="name" id="hName">—</div>
    <div class="tag" id="hTag"></div>
  </div>
  <button id="backBtn">← Back</button>
</header>

<!-- Character picker -->
<div id="picker">
  <h1>Velour</h1>
  <!-- character cards get injected here -->
</div>

<!-- Chat log -->
<div id="chat"></div>
<div id="error"></div>

<!-- Composer -->
<form id="composer" autocomplete="off">
  <input id="input" type="text" placeholder="Say something…" maxlength="500" />
  <button id="send" type="submit" aria-label="Send">➤</button>
</form>

<script>
/* =========================================================
   1. CONFIG — PASTE YOUR CLOUDFLARE WORKER URL HERE
   ========================================================= */
const API_URL = "https://YOUR-WORKER-NAME.YOUR-SUBDOMAIN.workers.dev";

/* =========================================================
   2. CHARACTERS — edit/add as many as you like
   ========================================================= */
const CHARACTERS = [
  {
    id: "seraphine",
    name: "Seraphine",
    tag: "Midnight lounge singer",
    bio: "Sultry, mysterious, and always seems to know more than she lets on. Meets you in a dim jazz bar after hours.",
  },
  {
    id: "kai",
    name: "Kai",
    tag: "Your rival, unfortunately charming",
    bio: "Sharp-tongued and competitive, but there's a softness under the sarcasm that only shows when you least expect it.",
  },
  {
    id: "nova",
    name: "Nova",
    tag: "Runaway starlight",
    bio: "An excitable traveler from somewhere far too distant, endlessly curious about you and everything you do.",
  },
];

/* =========================================================
   3. STATE
   ========================================================= */
let currentChar = null;
let history = [];      // [{ role: "user"|"assistant", content }]
let sending = false;

/* =========================================================
   4. DOM
   ========================================================= */
const pickerEl  = document.getElementById("picker");
const chatEl    = document.getElementById("chat");
const composer  = document.getElementById("composer");
const inputEl   = document.getElementById("input");
const sendBtn   = document.getElementById("send");
const headerEl  = document.getElementById("header");
const backBtn   = document.getElementById("backBtn");
const hAvatar   = document.getElementById("hAvatar");
const hName     = document.getElementById("hName");
const hTag      = document.getElementById("hTag");
const errorEl   = document.getElementById("error");

/* =========================================================
   5. BUILD CHARACTER CARDS
   ========================================================= */
function initials(name) {
  return name.trim().split(/\s+/).map(w => w[0]).join("").slice(0, 2).toUpperCase();
}

CHARACTERS.forEach(c => {
  const card = document.createElement("div");
  card.className = "card";
  card.innerHTML = `
    <div class="avatar">${initials(c.name)}</div>
    <div class="info">
      <div class="name"></div>
      <div class="tag"></div>
      <div class="bio"></div>
    </div>`;
  card.querySelector(".name").textContent = c.name;
  card.querySelector(".tag").textContent  = c.tag || "";
  card.querySelector(".bio").textContent  = c.bio || "";
  card.addEventListener("click", () => openChat(c));
  pickerEl.appendChild(card);
});

/* =========================================================
   6. OPEN / CLOSE CHAT
   ========================================================= */
function openChat(char) {
  currentChar = char;
  history = loadHistory(char.id);

  hAvatar.textContent = initials(char.name);
  hName.textContent   = char.name;
  hTag.textContent    = char.tag || "";

  pickerEl.style.display = "none";
  headerEl.style.display = "flex";
  chatEl.classList.add("active");
  composer.classList.add("active");

  renderHistory();
  if (!history.length) {
    // optional auto-greeting: just show a static intro bubble
    // (doesn't count as an API call)
    addBubble("bot", `*${char.name} looks over at you.* Hey. Didn't expect to see you here.`);
  }
  inputEl.focus();
}

function closeChat() {
  currentChar = null;
  chatEl.classList.remove("active");
  composer.classList.remove("active");
  headerEl.style.display = "none";
  pickerEl.style.display = "grid";
  chatEl.innerHTML = "";
  hideError();
}

backBtn.addEventListener("click", closeChat);

/* =========================================================
   7. RENDER + BUBBLES
   ========================================================= */
function addBubble(role, text) {
  const div = document.createElement("div");
  div.className = "msg " + (role === "user" ? "user" : "bot");
  div.textContent = text;
  chatEl.appendChild(div);
  chatEl.scrollTop = chatEl.scrollHeight;
  return div;
}

function renderHistory() {
  chatEl.innerHTML = "";
  history.forEach(m => addBubble(m.role === "assistant" ? "bot" : "user", m.content));
}

/* =========================================================
   8. SEND MESSAGE
   ========================================================= */
composer.addEventListener("submit", async (e) => {
  e.preventDefault();
  const text = inputEl.value.trim();
  if (!text || sending || !currentChar) return;

  hideError();
  sending = true;
  sendBtn.disabled = true;
  inputEl.value = "";

  history.push({ role: "user", content: text });
  addBubble("user", text);

  const typing = addBubble("bot", "…");
  typing.classList.add("typing");

  try {
    const reply = await callWorker(currentChar, history);
    typing.remove();
    history.push({ role: "assistant", content: reply });
    addBubble("bot", reply);
    saveHistory(currentChar.id, history);
  } catch (err) {
    typing.remove();
    showError(err.message || "Something went wrong.");
    // roll back the user message so they can retry cleanly
    history.pop();
  } finally {
    sending = false;
    sendBtn.disabled = false;
    inputEl.focus();
  }
});

/* =========================================================
   9. CALL THE CLOUDFLARE WORKER
   ========================================================= */
async function callWorker(char, msgs) {
  if (API_URL.includes("YOUR-WORKER")) {
    throw new Error("Set API_URL at the top of index.html to your Cloudflare Worker URL.");
  }
  const res = await fetch(API_URL, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({
      character: { name: char.name, tag: char.tag, bio: char.bio },
      messages: msgs,
    }),
  });
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(data.error || `Server error (${res.status})`);
  if (!data.reply) throw new Error("Empty reply from server.");
  return data.reply;
}

/* =========================================================
   10. LOCAL STORAGE
   ========================================================= */
function saveHistory(id, msgs) {
  try { localStorage.setItem("velour:" + id, JSON.stringify(msgs.slice(-40))); }
  catch {}
}
function loadHistory(id) {
  try {
    const raw = localStorage.getItem("velour:" + id);
    return raw ? JSON.parse(raw) : [];
  } catch { return []; }
}

/* =========================================================
   11. ERRORS
   ========================================================= */
function showError(msg) {
  errorEl.textContent = msg;
  errorEl.style.display = "block";
}
function hideError() {
  errorEl.style.display = "none";
}
</script>
</body>
</html>
